services:
  activepieces:
    image: activepieces/activepieces:latest
    container_name: activepieces
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      AP_ENGINE_EXECUTABLE_PATH: "dist/packages/engine/main.js"
      AP_ENCRYPTION_KEY: "7828b5de1b360a600a2b4e3dde519876"
      AP_JWT_SECRET: "a9064e18563be555887209c0c571e658a381180034d4c8ee63685a63ffb8e4eb"
      AP_WORKER_TOKEN: "5473477c3f729581b83f4cb63709c55150332ff5df4ddacbb68365538e7f3297"
      AP_API_KEY: ""
      AP_ENVIRONMENT: "prod"
      AP_FRONTEND_URL: "http://localhost:8080"
      AP_POSTGRES_DATABASE: "activepieces"
      AP_POSTGRES_HOST: "postgres"
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: "postgres"
      AP_POSTGRES_PASSWORD: "postgres"
      AP_REDIS_HOST: "redis"
      AP_REDIS_PORT: "6379"
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: "5"
    volumes:
      - ap_config:/root/.activepieces
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14.4
    container_name: ap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "activepieces"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    container_name: ap-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
  ap_config:
